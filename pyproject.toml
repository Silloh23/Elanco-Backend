[project]
name = "tickwatch"
version = "0.1.0"
description = "Tick sighting ingestion and query API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.9", "pydantic-settings>=2.5", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
